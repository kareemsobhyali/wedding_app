name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: wedding_user
          POSTGRES_PASSWORD: wedding_password
          POSTGRES_DB: wedding_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://wedding_user:wedding_password@localhost:5432/wedding_test?schema=public
      JWT_SECRET: test-secret-do-not-use-in-prod
      NODE_ENV: test
      CORS_ORIGIN: http://localhost:3000

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Generate Prisma Client
      run: npx prisma generate
      
    - name: Run Prisma Migrations (Test DB)
      run: npx prisma migrate deploy

    - name: Typecheck Backend
      run: npm run typecheck --workspace=api --if-present

    - name: Typecheck Frontend
      run: npm run typecheck --workspace=web --if-present
      
    - name: Run Backend Unit Tests
      run: npm run test --workspace=api
      
    - name: Build API (NestJS)
      run: npm run build --workspace=api
      
    - name: Build Web (Next.js)
      run: npm run build --workspace=web
      env:
        NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
