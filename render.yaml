services:
  # Single Unified Full-Stack Next.js Web Service
  - type: web
    name: wedding-web
    env: node
    plan: free
    buildCommand: npm install --include=dev && npx prisma generate --schema=packages/database/prisma/schema.prisma && npx prisma db push --schema=packages/database/prisma/schema.prisma --accept-data-loss && npm run build --workspace=web
    startCommand: npm run start --workspace=web
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: HOSTNAME
        value: 0.0.0.0
      - key: DATABASE_URL
        sync: false
      - key: NEXT_PUBLIC_API_URL
        value: /api/v1
      - key: ADMIN_EMAIL
        value: admin@wedding.com
      - key: ADMIN_PASSWORD
        value: admin123456
