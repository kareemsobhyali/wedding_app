services:
  - type: web
    name: wedding-api
    env: node
    buildCommand: npm install && npx prisma generate && npm run build --workspace=api
    startCommand: npm run start:prod --workspace=api
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        fromDatabase:
          name: wedding-db
          property: connectionString
      - key: CORS_ORIGIN
        value: https://wedding.com
      - key: JWT_SECRET
        generateValue: true
      - key: R2_ENDPOINT
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_PUBLIC_URL
        sync: false

databases:
  - name: wedding-db
    databaseName: wedding
    user: wedding_user
    plan: starter
