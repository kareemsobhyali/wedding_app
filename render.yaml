services:
  # 1. NestJS Backend API Service
  - type: web
    name: wedding-api
    env: node
    plan: free
    buildCommand: npm install && npx prisma generate --schema=packages/database/prisma/schema.prisma && npm run build --workspace=api
    startCommand: npm run start:prod --workspace=api
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: wedding-db
          property: connectionString
      - key: CORS_ORIGIN
        value: https://wedding-web.onrender.com
      - key: JWT_SECRET
        generateValue: true

  # 2. Next.js Frontend Web Service
  - type: web
    name: wedding-web
    env: node
    plan: free
    buildCommand: npm install && npm run build --workspace=web
    startCommand: npm run start --workspace=web
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: NEXT_PUBLIC_API_URL
        value: https://wedding-api.onrender.com/api/v1
      - key: NEXT_PUBLIC_APP_URL
        value: https://wedding-web.onrender.com

databases:
  - name: wedding-db
    databaseName: wedding
    user: wedding_user
    plan: free
